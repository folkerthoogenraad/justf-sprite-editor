
<div class="app-container">
  <app-navbar></app-navbar>

  <app-sprite-view>
    <app-sprite-view-texture-component></app-sprite-view-texture-component>

    @for (sprite of state.sprites(); track sprite.id) {
      <app-sprite-view-sprite-outline-component
        [sprite]="sprite"
        [selected]="state.isSelected(sprite)"
        (select)="state.select(sprite)" />
    }
  </app-sprite-view>
</div>
