
<div class="app-container">
  <app-navbar></app-navbar>

  <app-sidebar class="left" left>
    <app-textures-explorer />
    <app-sprites-explorer />
  </app-sidebar>
  
  <app-sidebar class="right" right>
    <app-sprite-details [sprite]="selection.selectedSprite()" (spriteChange)="state.updateSprite(selection.selectedSprite(), $event)" />
    <app-sprite-frame-details [spriteAndFrames]="selection.selectedSpritesAndFrames()" (change)="state.updateResources($event)" />
  </app-sidebar>

  <app-sprite-canvas>
    <app-select-component></app-select-component>
    <app-texture-component></app-texture-component>

    @for (sprite of state.spritesForTexture(); track sprite.id) {
        <app-sprite-outline-component 
          [sprite]="sprite"
          (spriteChange)="state.updateSprite(sprite, $event)"
          ></app-sprite-outline-component>
    }
  </app-sprite-canvas>
</div>
