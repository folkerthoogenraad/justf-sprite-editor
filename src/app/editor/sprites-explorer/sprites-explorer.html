<div class="sidebar-panel">
    <div class="heading">
        <div class="title">Sprites explorer</div>
        <div class="actions">
            <c-button (click)="duplicateSelected()">D</c-button>
        </div>
    </div>
    @if(!state.resources()) {
        <div class="content">
            <p>Nothing to show.</p>
        </div>
    }
    @else {
        <div class="content sprites">
            @for (sprite of state.spritesForTexture(); track sprite.id) {
                <div 
                    class="sprite" 
                    [class.selected]="state.isSelected(sprite)"
                    (click)="state.select(sprite)">{{ sprite.id }}</div>
            }
        </div>
    }
</div>
