<div class="sidebar-panel">
    <div class="heading">
        <c-icon icon="icon-sprite" />
        <div class="title">Sprites explorer ({{sprites().length }})</div>
        <div class="actions">
            <c-toggle-button [(enabled)]="showAll" title="Show all">
                @if(showAll()){
                    <c-icon icon="icon-show-textures-open"></c-icon>
                }
                @else {
                    <c-icon icon="icon-show-textures-closed"></c-icon>
                }
            </c-toggle-button>
        </div>
    </div>
    @if(!state.resources()) {
        <div class="content">
            Nothing to show.
        </div>
    }
    @if(sprites().length === 0) {
        <div class="content">
            No sprites here, did you select a texture?
        </div>
    }
    @else {
        <div class="sprites">
            @for (sprite of sprites(); track sprite.id) {
                <app-sprite-explorer-item [sprite]="sprite" />
            }
        </div>
    }
</div>
