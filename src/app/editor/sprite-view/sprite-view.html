<div class="sprite-view"
    (pointerup)="onPointerUp($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (wheel)="wheel($event)"
    [style]="backgroundStyles()"
    (keydown)="keyDown($event)"
    tabindex="0"
    #viewport>
    <ng-content></ng-content>
</div>
