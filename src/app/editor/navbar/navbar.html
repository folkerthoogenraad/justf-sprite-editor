<nav>
    <div class="buttons global-buttons">
        <c-button (click)="folder.openFolder()">
            <c-icon icon="icon-open" /> open
        </c-button>
        <c-button (click)="state.saveResources()" [disabled]="!state.hasChangedSinceLastSave()">
            <c-icon icon="icon-save" /> save
        </c-button>
    </div>

    <div class="buttons context-buttons">
        <c-toggle-button [enabled]="isSelectTool()" (click)="setSelectTool()">
            <c-icon icon="icon-edit" /> select
        </c-toggle-button>
        <c-toggle-button [enabled]="isSpriteTool()" (click)="setSpriteTool()">
            <c-icon icon="icon-sprite" /> sprites
        </c-toggle-button>
        <c-toggle-button [enabled]="isFrameTool()" (click)="setFrameTool()">
            <c-icon icon="icon-frame" /> frames
        </c-toggle-button>
    </div>

    <div class="buttons context-buttons">
        <c-button (click)="state.undo()" title="Undo">
            <c-icon icon="icon-undo" />
        </c-button>
        <c-button (click)="state.redo()" title="Redo">
            <c-icon icon="icon-redo" />
        </c-button>
    </div>
</nav>
