<div class="outline"
    [style.left.px]="styleLeft()"
    [style.top.px]="styleTop()"
    [style.width.px]="styleWidth()"
    [style.height.px]="styleHeight()"
    [class.selected]="selection.isSelected(sprite())">

    @if(selection.isSelected(sprite())){
        <div class="sprite-id">
            <c-changable-text [value]="sprite().id" (valueChange)="updateSpriteName($event)"></c-changable-text>
        </div>
    }
</div>

@for (frame of sprite().frames; track $index) {
    <app-sprite-frame-outline-component
        [sprite]="sprite()"
        [frameIndex]="$index"
        (frameChange)="updateFrame(frame, $event)"
        ></app-sprite-frame-outline-component>
}
