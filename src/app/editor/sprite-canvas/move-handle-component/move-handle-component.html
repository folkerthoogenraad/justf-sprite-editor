<div class="handle-root" 
    #root
    (pointerdown)="onPointerDown($event)" 
    (pointermove)="onPointerMove($event)" 
    (pointerup)="onPointerUp($event)"
    [style.left.px]="styleLeft()"
    [style.top.px]="styleTop()">

    <div class="handle-icon" title="origin">
        <img src="images/handle-origin.png" alt="">
    </div>
    
    @if(this.dragPointerId > 0) {
        <span class="preview">{{ (this.offset()?.x ?? 0) + this.x() }}x{{(this.offset()?.y ?? 0) + this.y()}} </span>
    }

</div>
