<div class="handle-root" 
    (pointerdown)="onPointerDown($event)" 
    (pointermove)="onPointerMove($event)" 
    (pointerup)="onPointerUp($event)"
    [style.left.px]="styleLeft()"
    [style.top.px]="styleTop()">

    <div class="handle-display"></div>

    @if(this.dragPointerId > 0) {
        <span class="preview">{{ (this.offset()?.x ?? 0) + this.x() }}x{{(this.offset()?.y ?? 0) + this.y()}} </span>
    }

</div>
