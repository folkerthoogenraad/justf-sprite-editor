<div class="content">
    {{valueInternal()}}
    
    <input type="text" 
        #input
        spellcheck="false"
        [(ngModel)]="valueInternal"
        (keydown.enter)="commitInternal(false)"
        [class.invalid]="!valid()"
        [class.border]="border()"
        (blur)="commitInternal(false)"
        >
</div>
